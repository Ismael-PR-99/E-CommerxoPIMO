# Docker Compose para E-Commerce PIMO
# Levanta: Postgres, Redis, ML-Service (FastAPI), ecommerce-api (Spring Boot)
version: '3.8'

# Variables de entorno compartidas
x-common-env: &common-env
  APP_JWT_SECRET: ${APP_JWT_SECRET:-your-super-secret-jwt-key-change-in-production-256-bits-long}

# Configuración de logging
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===== BASE DE DATOS POSTGRESQL =====
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/optimizations.sql:/docker-entrypoint-initdb.d/02-optimizations.sql:ro
    networks:
      - ecommerce-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===== CACHE REDIS =====
  redis:
    image: redis:7.2-alpine
    container_name: ecommerce-redis
    profiles: ["dev", "prod"]
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ===== ML SERVICE (FASTAPI - PUERTO 8001) =====
  ml-service:
    build: 
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ecommerce-ml-service
    profiles: ["dev", "prod"]
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    environment:
      <<: *common-env
      # Base de datos
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-ecommerce_db}
      # Redis para cache
      REDIS_URL: redis://redis:6379/0
      # Configuración FastAPI
      FASTAPI_ENV: ${ENVIRONMENT:-development}
      PYTHONPATH: /app
      # CORS orígenes permitidos
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      # Workers y configuración
      WORKERS: ${ML_WORKERS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== ECOMMERCE API (SPRING BOOT - PUERTO 8080) =====
  ecommerce-api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-api
    profiles: ["dev", "prod"]
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      <<: *common-env
      # Configuración Spring
      SPRING_PROFILES_ACTIVE: docker,${ENVIRONMENT:-dev}
      # Base de datos
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecommerce_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      # Configuración JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}
      # ML Service conexión interna
      ML_SERVICE_URL: http://ml-service:8001
      ML_SERVICE_TIMEOUT: ${ML_TIMEOUT:-30000}
      # CORS configuración
      CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Configuración JWT
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # Java optimizaciones
      JAVA_OPTS: -Xmx${JAVA_MAX_MEMORY:-512m} -Xms${JAVA_MIN_MEMORY:-256m} -XX:+UseG1GC
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== FRONTEND (DESARROLLO SOLO) =====
  frontend-dev:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend-dev
    profiles: ["dev"]
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8080}/api
      VITE_ML_SERVICE_URL: http://localhost:${ML_SERVICE_PORT:-8001}
    depends_on:
      ecommerce-api:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped
    logging: *default-logging

# ===== VOLUMENES PERSISTENTES =====
volumes:
  postgres_data:
    driver: local
    name: ecommerce_postgres_data
  redis_data:
    driver: local
    name: ecommerce_redis_data

# ===== RED INTERNA =====
networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network
    ipam:
      config:
        - subnet: 172.20.0.0/16