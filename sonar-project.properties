# Configuración SonarCloud para análisis de código
sonar.projectKey=ecommerce-pimo
sonar.organization=tu-organizacion

# Configuración general
sonar.projectName=E-Commerce PIMO
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Configuración de fuentes
sonar.sources=backend/src/main,ml-service/app,frontend/src
sonar.tests=backend/src/test,ml-service/tests,frontend/tests

# Exclusiones globales
sonar.exclusions=**/node_modules/**,**/target/**,**/*.min.js,**/vendor/**,**/migrations/**

# Configuración Java (Backend)
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.jacoco.reportPaths=backend/target/jacoco.exec
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Exclusiones Java
sonar.coverage.exclusions=**/config/**,**/dto/**,**/entity/**,**/exception/**,**/*Application.java

# Configuración Python (ML Service)
sonar.python.coverage.reportPaths=ml-service/coverage.xml
sonar.python.xunit.reportPath=ml-service/test-results.xml

# Exclusiones Python
sonar.python.coverage.exclusions=**/tests/**,**/test_*,**/conftest.py,**/main.py,**/config.py

# Configuración TypeScript/JavaScript (Frontend)
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusiones Frontend
sonar.typescript.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.spec.ts

# Configuración de calidad
sonar.qualitygate.wait=true

# Configuración de duplicados
sonar.cpd.exclusions=**/dto/**,**/entity/**

# Configuración de issues
sonar.issue.ignore.multicriteria=e1,e2,e3

# Excluir reglas específicas para tests
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S5976
sonar.issue.ignore.multicriteria.e1.resourceKey=**/test/**/*

# Excluir magic numbers en tests
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S109
sonar.issue.ignore.multicriteria.e2.resourceKey=**/test/**/*

# Excluir reglas de naming en tests
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S100
sonar.issue.ignore.multicriteria.e3.resourceKey=**/test/**/*