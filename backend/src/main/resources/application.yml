# ========================================
# CONFIGURACIÓN E-COMMERCE API SPRING BOOT
# ========================================

# === APLICACIÓN ===
spring:
  application:
    name: ecommerce-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

# === BASE DE DATOS ===
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # === JPA/HIBERNATE ===
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # === FLYWAY ===
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# === JWT CONFIGURACIÓN ===
app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-token:
      expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token:
      expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# === CORS CONFIGURACIÓN ===
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

# === ML SERVICE ===
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8001}
    timeout: ${ML_SERVICE_TIMEOUT:30000}

# === ACTUATOR ===
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans,conditions
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# === RESILIENCE4J ===
resilience4j:
  circuitbreaker:
    instances:
      ml-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        
  retry:
    instances:
      ml-service:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        
  timeout:
    instances:
      ml-service:
        timeout-duration: 10s
        cancel-running-future: true

# === OPENAPI DOCUMENTACIÓN ===
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: true
  
# === LOGGING ===
logging:
  level:
    com.ecommercepimo.ecommerce: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.springframework.web: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    io.github.resilience4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10

---
# === PERFIL DESARROLLO ===
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
logging:
  level:
    com.ecommercepimo.ecommerce: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

---
# === PERFIL DOCKER ===
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:ecommerce_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password123}
app:
  ml-service:
    url: http://ml-service:8001

---
# === PERFIL PRODUCCIÓN ===
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
logging:
  level:
    com.ecommercepimo.ecommerce: WARN
    org.springframework.security: WARN