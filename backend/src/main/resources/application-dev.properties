# Configuración para desarrollo
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.show_sql=true

# ML Service en desarrollo
app.ml-service.url=http://localhost:8001

# JWT en desarrollo - Access token 15 min, Refresh token 7 días
app.jwt.access-token.expiration=900000
app.jwt.refresh-token.expiration=604800000

# CORS en desarrollo
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080
app.cors.allow-credentials=true

# Logs más detallados en desarrollo
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
