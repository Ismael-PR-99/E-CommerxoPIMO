name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/ecommerce-backend
  IMAGE_NAME_ML: ${{ github.repository }}/ml-service
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ==================== TESTS UNITARIOS ====================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            java-version: '17'
            test-command: './mvnw test'
            coverage-path: 'backend/target/site/jacoco/jacoco.xml'
          - service: ml-service
            python-version: '3.11'
            test-command: 'pytest tests/ -v --cov=app --cov-report=xml'
            coverage-path: 'ml-service/coverage.xml'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ============ BACKEND JAVA TESTS ============
    - name: Setup Java (Backend)
      if: matrix.service == 'backend'
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'

    - name: Cache Maven dependencies
      if: matrix.service == 'backend'
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Backend Tests
      if: matrix.service == 'backend'
      working-directory: ./backend
      run: |
        chmod +x mvnw
        ./mvnw clean test -Dspring.profiles.active=test
        ./mvnw jacoco:report

    # ============ ML SERVICE PYTHON TESTS ============
    - name: Setup Python (ML Service)
      if: matrix.service == 'ml-service'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      if: matrix.service == 'ml-service'
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install Python dependencies
      if: matrix.service == 'ml-service'
      working-directory: ./ml-service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio httpx

    - name: Run ML Service Tests
      if: matrix.service == 'ml-service'
      working-directory: ./ml-service
      run: |
        pytest tests/ -v \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --cov-fail-under=60

    # ============ UPLOAD COVERAGE ============
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ${{ matrix.coverage-path }}
        flags: ${{ matrix.service }}
        name: ${{ matrix.service }}-coverage
        fail_ci_if_error: true

  # ==================== TESTS DE INTEGRACIÓN ====================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.m2
          ~/.cache/pip
        key: ${{ runner.os }}-deps-${{ hashFiles('**/pom.xml', '**/requirements.txt') }}

    - name: Install dependencies
      run: |
        # Backend dependencies
        cd backend && chmod +x mvnw && ./mvnw dependency:go-offline -q
        
        # ML Service dependencies
        cd ../ml-service && pip install -r requirements.txt

    - name: Wait for services
      run: |
        echo "Waiting for PostgreSQL..."
        until pg_isready -h localhost -p 5432 -U test; do sleep 2; done
        
        echo "Waiting for Redis..."
        until redis-cli -h localhost -p 6379 ping; do sleep 2; done

    - name: Run Backend Integration Tests
      working-directory: ./backend
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
        SPRING_DATASOURCE_USERNAME: test
        SPRING_DATASOURCE_PASSWORD: test
        SPRING_DATA_REDIS_HOST: localhost
        SPRING_DATA_REDIS_PORT: 6379
      run: |
        ./mvnw test -Dtest="**/*IntegrationTest" -Dspring.profiles.active=test

    - name: Run ML Service Integration Tests
      working-directory: ./ml-service
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/testdb
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/integration/ -v

  # ==================== ANÁLISIS DE CÓDIGO ====================
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install analysis tools
      run: |
        # Python code analysis
        pip install flake8 black isort bandit safety

    - name: Run Backend Code Analysis
      working-directory: ./backend
      run: |
        chmod +x mvnw
        # Checkstyle
        ./mvnw checkstyle:check
        # SpotBugs
        ./mvnw spotbugs:check
        # PMD
        ./mvnw pmd:check

    - name: Run Python Code Analysis
      working-directory: ./ml-service
      run: |
        # Code formatting check
        black --check app/ tests/
        
        # Import sorting check
        isort --check-only app/ tests/
        
        # Linting
        flake8 app/ tests/ --max-line-length=100
        
        # Security check
        bandit -r app/
        
        # Dependency vulnerability check
        safety check

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==================== BUILD Y PUSH IMÁGENES ====================
  build-images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [integration-tests, code-analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service: [backend, ml-service, frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==================== TESTS E2E ====================
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Start services with Docker Compose
      run: |
        docker-compose -f docker-compose.yml up -d
        sleep 30  # Wait for services to be ready

    - name: Wait for services health check
      run: |
        echo "Checking backend health..."
        timeout 60 bash -c 'until curl -f http://localhost:8080/actuator/health; do sleep 2; done'
        
        echo "Checking ML service health..."
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
        
        echo "Checking frontend..."
        timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

    - name: Run E2E Tests
      working-directory: ./frontend
      run: |
        npm run test:e2e

    - name: Stop services
      if: always()
      run: docker-compose -f docker-compose.yml down

  # ==================== SECURITY SCAN ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service: [backend, ml-service, frontend]

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
        format: 'sarif'
        output: 'trivy-results-${{ matrix.service }}.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

  # ==================== DEPLOY ====================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [e2e-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Aquí iría la lógica real de deployment
        # Por ejemplo: kubectl, docker-compose, etc.

  # ==================== NOTIFICATION ====================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, code-analysis, build-images, e2e-tests, security-scan, deploy]
    if: always()

    steps:
    - name: Notify Success
      if: ${{ needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' }}
      run: |
        echo "✅ All tests passed successfully!"
        # Aquí se puede agregar notificación a Slack, Discord, etc.

    - name: Notify Failure
      if: ${{ needs.unit-tests.result == 'failure' || needs.integration-tests.result == 'failure' }}
      run: |
        echo "❌ Some tests failed!"
        # Aquí se puede agregar notificación de error